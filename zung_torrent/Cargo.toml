[package]
name = "zung_torrent"
version = "0.1.0"
edition = "2021"
authors = ["Ishaan Goel <ishaangoel.99@gmail.com>"]
description = "A BitTorrent Client Library"
license = "MIT"
repository = "https://github.com/ishaan26/zung"
readme = "README.md"
keywords = ["projects", "learning", "torrent", "protocol"]

[features]
default = ["client"]
client = ["dep:colored", "dep:human_bytes"]

[dependencies]

colored = { version = "3.0.0", optional = true }
anyhow = "1.0.95"
bytes = { version = "1.9.0", features = ["serde"] }
clap = { version = "4.5.27", features = ["derive"] }
dashmap = { version = "6.1.0", features = ["rayon"] }
hex = "0.4.3"
chrono = { version = "0.4.39", features = ["serde"] }
sha1_smol = "1.0.1"
rayon = "1.10.0"
indexmap = "2.7.1"
human_bytes = { version = "0.4.3", optional = true }
reqwest = "0.12.12"
parking_lot = "0.12.3"
tracing = "0.1.41"

tokio = { version = "1.43.0", features = [
  "net",
  "rt",
  "rt-multi-thread",
  "macros",
  "tracing",
] }
futures = "0.3.31"

serde = { version = "1.0.217", features = ["derive"] }
serde_bytes = "0.11.15"
serde_urlencoded = "0.7.1"

zung_parsers = { version = "0.1.1", path = "../zung_parsers" }

[dev-dependencies]
utilities = { path = "../utilities" }
