[package]
name = "zung_torrent"
version = "0.1.0"
edition = "2021"
authors = ["Ishaan Goel <ishaangoel.99@gmail.com>"]
description = "A BitTorrent Client Library"
license = "MIT"
repository = "https://github.com/ishaan26/zung"
readme = "README.md"
keywords = ["projects", "learning", "torrent", "protocol"]

[features]
default = ["client"]
client = ["dep:colored", "dep:human_bytes"]

[dependencies]
colored = { version = "3.0.0", optional = true }
anyhow = "1.0.97"
bytes = { version = "1.10.1", features = ["serde"] }
clap = { version = "4.5.34", features = ["derive"] }
dashmap = { version = "6.1.0", features = ["rayon"] }
chrono = { version = "0.4.40", features = ["serde"] }
sha1_smol = "1.0.1"
rayon = "1.10.0"
indexmap = "2.8.0"
human_bytes = { version = "0.4.3", optional = true }
reqwest = "0.12.15"
parking_lot = "0.12.3"
tracing = "0.1.41"
rand = "0.9.0"

tokio = { version = "1.44.1", features = [
  "net",
  "rt",
  "rt-multi-thread",
  "macros",
  "tracing",
] }
tokio-util = { version = "0.7.14", features = ["time"] }
futures = "0.3.31"

serde = { version = "1.0.219", features = ["derive"] }
serde_bytes = "0.11.17"
serde_urlencoded = "0.7.1"

zung_parsers = { version = "0.1.1", path = "../zung_parsers" }

[dev-dependencies]
utilities = { path = "../utilities" }
